<!doctype html>
<html lang="zh-CN">
<!-- webdemo-v7-pages -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Web UI Cache Demo</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#121821;color:#e8eef6;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:14px;box-sizing:border-box}
  h1{font-size:18px;margin:0 0 2px}
  button{min-width:140px;padding:10px 14px;font-size:15px;border-radius:9px;
    border:1px solid #4a6a8a;background:linear-gradient(#2a3d52,#1a2836);color:#eaf2ff}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  pre{margin:0;width:100%;max-height:84px;overflow:auto;background:#0b1118;border:1px solid #24384c;
    border-radius:8px;padding:8px;font-size:12px;white-space:pre-wrap}
  #stats{font-size:11px;opacity:.8;width:100%;word-break:break-all}
</style>
</head>
<body>
<h1>Web UI Cache Demo</h1>
<div class="row"><button id="btn">点击我 <span id="count">0</span></button></div>
<div class="row"><button id="toggle">缓存：开</button><button id="url">URL 缓存测试</button></div>
<div class="row"><button id="snap">页面快照</button><button id="clear">清空缓存</button></div>
<pre id="out">ready</pre>
<div id="stats"></div>
<script src="app.js"></script>
</body>
</html>
